name: uav_search

scenario:
  map_size: 3000
  num_uavs: 6
  num_targets: 50
  num_obstacles: 30
  altitude_min: 0
  altitude_max: 150
  max_speed: 20
  max_accel: 2.0
  dt: 1
  max_steps: 3000
  gcs_position: [1500, 0, 0.0]
  gcs_exclusion_radius_m: 150
  target_exclusion_radius_m: 250
  battery_j: 277200
  grid_cell_m: 25
  obstacle_radius_min_m: 50.0
  obstacle_radius_max_m: 130.0
  obstacle_height_min_m: 30.0
  obstacle_height_max_m: 120.0


safety:
  peer_distance_m: 30.0
  obstacle_clearance_m: 30.0

spawn:
  launch_radius_m: 300.0
  launch_min_spacing_m: 60.0

apf:
  enabled: true
  soft_gain: 1.5
  lookahead_s: 3.0
  braking_margin: 1.5

sensing:
  pd: [0.99, 0.90, 0.80, 0.70]
  pf: [0.01, 0.10, 0.20, 0.30]
  altitude_anchors: [0.0, 50.0, 100.0, 150.0]
  belief_prior: 0.5
  confirmation_threshold: 0.99
  fine_altitude: 50.0
  verified_empty_belief: 0.01
  camera_full_fov_deg: 90
  obstacle_occlusion: true

communication:
  report_bytes: 1000000
  buffer_bytes: 3000000
  pending_buffer_bytes: 3000000
  report_ttl: 300.0
  peer_contact_range_m: 500
  gcs_contact_range_m: 500
  tx_power_min_w: 0.1
  tx_power_max_w: 0.4
  bandwidth_hz: 10000000.0
  max_link_rate_bps: 2000000.0
  snr_threshold_db: 6.0
  noise_power_dbm: -110.0
  reference_gain_db: -70.0
  reference_distance_m: 1.0
  path_loss_exponent: 2.0
  nlos_additional_loss_db: 19.0

  uavnetsim:
    path: null
    mac_protocol: CSMA_CA
    channel_mode: a2a
    los_model: free_space
    nlos_model: urban
    payload_bytes: 1024
    packet_lifetime_s: 10.0
    max_queue_size: 200
    obstacle_polygon_sides: 16
    carrier_frequency_hz: 2400000000.0
    bandwidth_hz: 22000000.0
    bit_rate_bps: 2000000.0
    sinr_threshold_db: 6.0
    cca_threshold_dbm: -82.0
    thermal_noise_density_dbm_hz: -174.0
    receiver_noise_figure_db: 7.0
    max_retransmission_attempt: 5

  gpu_surrogate:
    packet_ack_bits: 240
    packet_sifs_us: 10.0
    packet_slot_us: 20.0
    packet_cw_min: 31
    packet_difs_us: 50.0
    packet_contention_decay: 0.8
    network_interference: true
    expected_backoff: true

observation:
  belief_patch_cells: 13
  belief_coarse_cells: 10
  nearest_obstacles: 3
  critic_belief_grid_cells: 10

energy:
  idle_power_w: 20.0
  hover_power_w: 120.0
  speed_sq_coeff: 0.5
  accel_sq_coeff: 2.0
