provider: kaggle
execution_mode: gpu
device: cuda:0
num_envs: 4096
network_backend: uavnetsim_gpu
auto_multi_gpu: true
max_gpus: 2
multi_gpu_strategy: ddp
compile_mode: null
cuda_graph_policy_actions: false
fused_adam: false
offpolicy:
  auto_scale_gradient_steps: true
  min_replay_sample_ratio: 1.0
vector:
  context: fork
  shared_memory: true
  overlap_env_and_updates: true
  backend: auto
  cuda_num_envs: 4
torch_sensing:
  enabled: false
  device: auto
  dtype: float64
  batch_timeout_s: 0.002
  overlap_env_and_updates: false
amp:
  enabled: false
  dtype: float16
gpu:
  benchmark_env_counts: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048]
  benchmark_vector_steps: 200
  world_candidates: 256
  world_sampling_rounds: 4
