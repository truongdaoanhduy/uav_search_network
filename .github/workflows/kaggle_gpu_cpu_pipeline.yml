name: Kaggle UAV GPU -> CPU Pipeline

on:
  workflow_dispatch:
    inputs:
      algorithm:
        description: Training algorithm
        required: true
        type: choice
        options:
          - masac
          - matd3
        default: masac
      episodes:
        description: Total training episodes
        required: true
        default: "20000"
      envs:
        description: Parallel GPU environments
        required: true
        default: "4096"
      max_steps:
        description: Maximum steps per episode
        required: true
        default: "3000"
      cuda_graph:
        description: Enable CUDA Graph policy-action path
        required: true
        type: boolean
        default: true

concurrency:
  group: kaggle-uav-gpu-cpu-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gpu_train_then_cpu_visualize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: haibro1234
      KAGGLE_ACCOUNT_NAME: account_02
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install cloud controller dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kaggle>=2.2.4,<3"

      - name: Validate Kaggle cloud credential
        shell: bash
        run: |
          test -n "${KAGGLE_API_TOKEN}"
          kaggle kernels list --mine --page-size 1 >/dev/null

      - name: Run GPU -> CPU pipeline
        shell: bash
        run: |
          ALGORITHM="${{ inputs.algorithm }}"
          GPU_SLUG="uav-${ALGORITHM}-gha-${GITHUB_RUN_ID}-1-gpu"
          CPU_SLUG="uav-${ALGORITHM}-gha-${GITHUB_RUN_ID}-1-cpu"
          CUDA_GRAPH="${{ inputs.cuda_graph }}"
          if [ "$ALGORITHM" = "matd3" ]; then CUDA_GRAPH="false"; fi

          python scripts/kaggle_pipeline.py \
            --username "${KAGGLE_USERNAME}" \
            --algorithm "${ALGORITHM}" \
            --runtime kaggle_2xt4 \
            --experiment paper_20k \
            --seed 44 \
            --required-gpu-hours 0 \
            --machine-shape NvidiaTeslaT4 \
            --gpu-kernel-slug "${GPU_SLUG}" \
            --cpu-kernel-slug "${CPU_SLUG}" \
            --gpu-credential-dataset haibro1234/uav-wandb-credential-masac50k-d59860c \
            --cpu-log-wandb \
            --cpu-credential-dataset haibro1234/uav-wandb-credential-masac50k-d59860c \
            --launch-only \
            --gpu-session-timeout-seconds 43200 \
            --cpu-session-timeout-seconds 10800 \
            --output-dir pipeline_outputs \
            runtime.num_envs=${{ inputs.envs }} \
            runtime.cuda_graph_policy_actions=${CUDA_GRAPH} \
            runtime.max_gpus=2 \
            runtime.auto_multi_gpu=true \
            task.scenario.max_steps=${{ inputs.max_steps }} \
            experiment.total_episodes=${{ inputs.episodes }} \
            experiment.name=rewardv2_cloud_pipeline

      - name: Publish Kaggle stage links
        if: always()
        shell: bash
        run: |
          ALGORITHM="${{ inputs.algorithm }}"
          GPU_SLUG="uav-${ALGORITHM}-gha-${GITHUB_RUN_ID}-1-gpu"
          CPU_SLUG="uav-${ALGORITHM}-gha-${GITHUB_RUN_ID}-1-cpu"
          {
            echo "### Kaggle GPU → CPU pipeline"
            echo "- GPU Kaggle kernel: https://www.kaggle.com/code/${KAGGLE_USERNAME}/${GPU_SLUG}"
            echo "- CPU visualization kernel (pending scheduled reconciler): https://www.kaggle.com/code/${KAGGLE_USERNAME}/${CPU_SLUG}"
            echo "- GPU Output contains the training checkpoint/handoff plus CPU_VISUALIZATION_NEXT_STAGE.json."
            echo "- PNG/MP4 are produced in the separate CPU visualization kernel Output tab."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload launch manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kaggle-uav-pipeline-${{ github.run_id }}-${{ github.run_attempt }}
          path: pipeline_outputs/
          if-no-files-found: warn
          retention-days: 14
